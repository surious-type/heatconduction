name: Publish heat benchmark data and PNG figures

on:
  push:
    branches: [main]
    paths:
      - '.heat_publish/**'
      - '.github/workflows/publish_heat_results.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare measured timings
        shell: bash
        run: |
          set -euo pipefail
          cat .heat_publish/openmp.part* | base64 --decode > .heat_publish/openmp.xz
          cat .heat_publish/pthread.part* | base64 --decode > .heat_publish/pthread.xz
          echo "9ff70d3892b7e8bf2f0585adddc1c9a49d1f73d2a8d555850e54900211b08cf6  .heat_publish/loop.xz" | sha256sum -c
          echo "66dbe15e13403e5dea6108499cf558006a2d0f1ab9b108faa262fb8af28ff4d3  .heat_publish/openmp.xz" | sha256sum -c
          echo "6586cf48663c0c65d25718fe682321e37d0d8f4b38f60e4b3dbd1f022b950e31  .heat_publish/pthread.xz" | sha256sum -c
      - name: Install visualization dependency
        run: python -m pip install --quiet matplotlib
      - name: Generate all benchmark tables and figures
        run: python .heat_publish/generate.py
      - name: Validate data coverage and PNG files
        shell: bash
        run: |
          set -euo pipefail
          test "$(($(wc -l < loop/results/results.csv) - 1))" -eq 400
          test "$(($(wc -l < openmp/results/results.csv) - 1))" -eq 2800
          test "$(($(wc -l < pthread/results/results.csv) - 1))" -eq 2800
          test "$(find . -path '*/figures/*.png' -type f | wc -l)" -eq 21
          for f in figures/{time,speedup,efficiency,mlups,compiler_comparison}.png; do test -s "$f"; done
      - name: Commit outputs directly to main and remove temporary generator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loop/results loop/figures openmp/results openmp/figures pthread/results pthread/figures figures comparison_summary.csv RESULTS.md
          git rm -r .heat_publish .github/workflows/publish_heat_results.yml
          git commit -m "Add complete heat benchmarks and comparison PNG figures"
          git push origin HEAD:main
