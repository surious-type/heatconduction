name: PDF отчёта

on:
  push:
    branches: [main]
    paths:
      - "report/report.md"
      - "figures/2026/**"
      - "errors/**"
      - "results/2026/**"
      - "scripts/build_pdf.sh"
      - "scripts/generate_report_figures.py"
      - ".github/workflows/report-pdf.yml"
  workflow_dispatch:

concurrency:
  group: heatconduction-report-main
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Установить Pandoc, XeLaTeX и конвертер SVG
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-lang-cyrillic texlive-fonts-recommended lmodern librsvg2-bin fonts-dejavu-core python3-matplotlib
      - name: Собрать отчёт
        run: bash scripts/build_pdf.sh
      - name: Опубликовать PNG-графики для Markdown в GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/2026/*.png figures/2026/classic/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Синхронизировать PNG-графики отчёта"
            # Сборки предыдущих коммитов могли совпасть по времени:
            # перебазируемся на актуальный main вместо перезаписи чужих правок.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Сохранить готовый PDF
        uses: actions/upload-artifact@v4
        with:
          name: heatconduction-report-pdf
          path: report/report.pdf
          if-no-files-found: error
